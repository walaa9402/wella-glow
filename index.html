<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" type="image/png" href="icon-192.png">

<body>
<title>Wella Glow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column — glowing header, routine tabs, step cards in order, water jar, week strip */
:root{
  --bg:#fbf5fb; --surface:#ffffff; --ink:#3c2a4c; --muted:#8b7899;
  --pink:#ec6ea3; --lav:#9b7fdc; --pink-soft:#fde3ef; --lav-soft:#eee6fc;
  --line:#f0e2f2; --done:#4fb38e; --done-soft:#dff4ea; --shadow:rgba(155,127,220,.18);
  --font-display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --font-body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1524; --surface:#281f33; --ink:#f7ecfa; --muted:#bba9c8;
  --pink:#ff8dbb; --lav:#bba2f3; --pink-soft:#45263b; --lav-soft:#33284a;
  --line:#3b2e4a; --done:#78d4ae; --done-soft:#1f3a31; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1524; --surface:#281f33; --ink:#f7ecfa; --muted:#bba9c8;
  --pink:#ff8dbb; --lav:#bba2f3; --pink-soft:#45263b; --lav-soft:#33284a;
  --line:#3b2e4a; --done:#78d4ae; --done-soft:#1f3a31; --shadow:rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.25;text-wrap:balance}
button{font-family:inherit;color:inherit}
button:focus-visible,label:focus-within{outline:3px solid var(--lav);outline-offset:2px}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 20px;
  background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero .sp{position:absolute;color:var(--pink);opacity:.55}
.hero .date{font-size:13px;color:var(--muted);letter-spacing:.02em}
.hero h1{font-size:30px;font-weight:800;color:var(--ink)}
.hero h1 .nm{color:var(--pink)}
.hero .quote{grid-column:1/-1;font-size:16px;font-weight:500;background:color-mix(in srgb,var(--surface) 70%,transparent);
  border-radius:18px;padding:12px 14px;margin:0}
.ring{width:84px;height:84px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px}
.ring .num small{display:block;font-family:var(--font-body);font-size:10px;font-weight:500;color:var(--muted);margin-top:-6px}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--surface);color:var(--ink)}
.chip b{color:var(--pink)}

/* Tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);padding:6px;border-radius:20px;box-shadow:0 4px 16px var(--shadow);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{border:0;background:transparent;border-radius:15px;padding:10px 8px;font-family:var(--font-display);font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted)}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff}
.tab .cnt{font-family:var(--font-body);font-size:12px;font-weight:700;background:color-mix(in srgb,currentColor 18%,transparent);padding:1px 8px;border-radius:999px}

/* Routine panel */
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head h2{font-size:22px}
.panel-head p{margin:0;color:var(--muted);font-size:14px}
.note{background:var(--lav-soft);border-radius:16px;padding:10px 14px;font-size:14px;margin:0}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lav),var(--pink));border-radius:inherit;transition:width .5s ease}
[dir="rtl"] .bar i{margin-inline-start:0}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;background:var(--surface);border-radius:22px;padding:12px;border:2px solid transparent;transition:transform .25s ease,border-color .25s,opacity .25s}
.step.now{border-color:var(--pink);box-shadow:0 8px 24px var(--shadow)}
.step.done{opacity:.72}
.thumb{width:84px;height:108px;background:linear-gradient(160deg,var(--pink-soft),var(--lav-soft));border-radius:16px;display:grid;place-items:center;overflow:hidden;position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb img.cut{object-fit:contain;padding:14px 12px;filter:drop-shadow(0 4px 6px var(--shadow))}
.thumb svg{width:56px;height:80px}
.step.done .thumb::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--done) 35%,transparent)}
.info{min-width:0;display:flex;flex-direction:column;gap:3px}
.info .lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.info .lbl .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pink-soft);color:var(--pink);font-size:12px}
.step.now .lbl .n{background:var(--pink);color:#fff}
.now-tag{font-size:11px;background:var(--pink);color:#fff;padding:0 8px;border-radius:999px}
.info h3{font-size:17px;font-weight:700}
.info .prod{font-size:13px;color:var(--muted);direction:ltr;text-align:left;overflow-wrap:anywhere}
[dir="rtl"] .info .prod{text-align:right}
.info .tip{font-size:13px;margin:2px 0 0;color:var(--ink)}
.acts{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.check{border:0;cursor:pointer;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;background:var(--pink-soft);color:var(--pink);display:inline-flex;align-items:center;gap:6px}
.step.now .check{background:var(--pink);color:#fff}
.step.done .check{background:var(--done-soft);color:var(--done)}
.photo-btn{font-size:12px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:6px 8px;border-radius:999px}
.photo-btn input{position:absolute;width:1px;height:1px;opacity:0}
.edit-btn{border:0;background:none;font-family:inherit}
.editor{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding:12px;border-radius:16px;background:var(--bg)}
.ed-lbl{font-size:12px;font-weight:700;color:var(--muted)}
.ed-name{font:inherit;font-size:15px;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.ed-name:focus{outline:none;border-color:var(--pink)}
.ed-photo{position:relative;align-self:flex-start;background:var(--lav-soft);color:var(--ink)}
.ed-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ed-row .photo-btn{border:0;background:none;font-family:inherit}
.photo-btn:hover{color:var(--lav)}

.celebrate{text-align:center;background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));border-radius:24px;padding:20px 16px}
.celebrate h3{font-size:22px;color:var(--pink)}
.celebrate p{margin:4px 0 0}

/* Water */
.card{background:var(--surface);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-head h2{font-size:20px}
.card-head span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.glass{border:0;background:transparent;padding:0;cursor:pointer;aspect-ratio:3/4;max-width:100%}
.glass svg{width:100%;height:100%}
.glass .w{fill:var(--line);transition:fill .3s}
.glass.on .w{fill:#7cc4f0}
.glass .o{fill:none;stroke:var(--lav);stroke-width:2}

/* Week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--lav-soft);border-radius:16px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;border:0;cursor:pointer;font-family:inherit}
.day.today{background:linear-gradient(160deg,var(--pink),var(--lav));color:#fff}
.day .dn{font-size:12px;font-weight:700}
.day .ic{font-size:16px;line-height:1}
.day .dots{display:flex;gap:3px}
.day .dots i{width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,currentColor 25%,transparent)}
.day .dots i.f{background:var(--done)}
.day.today .dots i.f{background:#fff}
.legend{font-size:12px;color:var(--muted);margin:0}
.preview{background:var(--bg);border-radius:16px;padding:12px 14px;font-size:14px}
.preview h3{font-size:16px;margin-bottom:4px}
.preview ol{margin:0;padding-inline-start:20px}

.reminders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.reminders li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 12px;background:var(--bg);border-radius:14px}
.reminders li b{font-variant-numeric:tabular-nums;color:var(--lav)}
footer{text-align:center;font-size:12px;color:var(--muted)}
.sync{font-size:11px;color:var(--muted);text-align:center}

.who{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.who-card{width:100%;max-width:380px;background:var(--surface);border-radius:28px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 20px 50px var(--shadow)}
.who-card h2{font-size:28px;color:var(--pink)}
.who-card p{margin:0;color:var(--muted)}
.who-btns,#whoForm{display:flex;flex-direction:column;gap:10px}
.big{border:0;cursor:pointer;border-radius:18px;padding:14px;font-family:var(--font-display);font-size:19px;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff}
.big.alt{background:var(--lav-soft);color:var(--ink)}
#whoForm label{font-weight:700;text-align:right}
#whoName{font:inherit;font-size:18px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
#whoName:focus{outline:none;border-color:var(--pink)}
.linkish{border:0;background:none;color:var(--lav);font-weight:700;cursor:pointer;font-size:12px;text-decoration:underline;padding:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:18px;font-weight:700;text-align:center;z-index:60;transform:translateY(150%);transition:transform .35s ease}
.toast.show{transform:none}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.thumb img.own{object-fit:cover}
.hero{padding-top:44px}
.lang{position:absolute;top:12px;inset-inline-start:14px;border:0;cursor:pointer;min-width:40px;height:30px;padding:0 10px;border-radius:999px;background:var(--surface);color:var(--lav);font-family:var(--font-display);font-weight:800;font-size:14px;box-shadow:0 2px 8px var(--shadow);z-index:2}
.who-card{position:relative}
.lang-in{top:14px;inset-inline-start:auto;inset-inline-end:14px}
</style>

<div dir="rtl" class="wrap" id="app">
  <header class="hero" aria-live="polite">
    <svg class="sp" style="top:10px;inset-inline-end:62px" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.8 6.4 4.8 10.4 12 12-7.2 1.6-11.2 5.6-12 12-.8-6.4-4.8-10.4-12-12C7.2 10.4 11.2 6.4 12 0z"/></svg>
    <svg class="sp" style="top:46px;inset-inline-end:96px" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.8 6.4 4.8 10.4 12 12-7.2 1.6-11.2 5.6-12 12-.8-6.4-4.8-10.4-12-12C7.2 10.4 11.2 6.4 12 0z"/></svg>
    <button type="button" class="lang" id="langBtn" aria-label="English">EN</button>
    <div>
      <div class="date" id="date"></div>
      <h1 id="greet">صباح الورد يا <span class="nm">لولو</span></h1>
    </div>
    <div class="ring">
      <svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--surface)" stroke-width="9"/><circle id="ringArc" cx="42" cy="42" r="34" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6" style="transition:stroke-dashoffset .6s ease"/><defs><linearGradient id="rg"><stop offset="0" stop-color="var(--lav)"/><stop offset="1" stop-color="var(--pink)"/></linearGradient></defs></svg>
      <div class="num"><div><span id="pct">0%</span><small id="todayLbl">النهارده</small></div></div>
    </div>
    <p class="quote" id="quote"></p>
    <div class="chips">
      <span class="chip" id="streakChip">🔥</span>
      <span class="chip" id="nightChip">🌙</span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-am" aria-selected="true" aria-controls="panel"><span id="tabAmTxt">☀️ الصباح</span> <span class="cnt" id="cnt-am">0/7</span></button>
    <button class="tab" role="tab" id="tab-pm" aria-selected="false" aria-controls="panel"><span id="tabPmTxt">🌙 المساء</span> <span class="cnt" id="cnt-pm">0/7</span></button>
  </nav>

  <section id="panel" role="tabpanel" style="display:flex;flex-direction:column;gap:12px">
    <div class="panel-head"><div><h2 id="ptitle"></h2><p id="psub"></p></div></div>
    <p class="note" id="pnote" hidden></p>
    <div class="bar"><i id="pbar"></i></div>
    <ol class="steps" id="steps"></ol>
    <div class="celebrate" id="celebrate" hidden><h3 id="celTitle"></h3><p id="celText"></p></div>
  </section>

  <section class="card" aria-labelledby="wTitle">
    <div class="card-head"><h2 id="wTitle">💧</h2><span id="wCount"></span></div>
    <div class="glasses" id="glasses"></div>
    <p class="legend" id="wMsg"></p>
  </section>

  <section class="card" aria-labelledby="weekTitle">
    <div class="card-head"><h2 id="weekTitle"></h2><span id="weekLegend"></span></div>
    <div class="week" id="week"></div>
    <div class="preview" id="preview"></div>
  </section>

  <section class="card" aria-labelledby="rTitle" id="remCard">
    <div class="card-head"><h2 id="rTitle"></h2><span id="rSub"></span></div>
    <ul class="reminders" id="remList"></ul>
  </section>

  <footer><span id="foot"></span> · <button type="button" class="linkish" id="switchWho"></button></footer>
</div>

<div class="who" id="who" hidden role="dialog" aria-modal="true" aria-labelledby="whoT">
  <div class="who-card" id="whoCard" dir="rtl">
    <button type="button" class="lang lang-in" id="langBtn2">EN</button>
    <h2 id="whoT"></h2>
    <p id="whoQ"></p>
    <div class="who-btns" id="whoStep1">
      <button type="button" class="big" id="whoMe"></button>
      <button type="button" class="big alt" id="whoOther"></button>
    </div>
    <form id="whoForm" hidden>
      <label for="whoName" id="whoNameLbl"></label>
      <input id="whoName" maxlength="20" autocomplete="given-name" required>
      <button class="big" type="submit" id="whoGo"></button>
    </form>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>

   whoT:"أهلًا بيكي ✨",whoQ:"مين معانا النهارده؟",whoMe:"أنا ولاء 💜",whoOther:"حد تاني",whoName:"اسمك إيه؟",whoGo:"يلا نبدأ 🌸",hello:n=>`أهلًا يا ${n} 💕`,langBtn:"EN",langAria:"English"},
 en:{greetAm:"Good morning,",greetMid:"Have a sweet day,",greetPm:"Good evening,",today:"today",streak:n=>`🔥 ${n} ${n===1?"day":"days"} in a row`,tonight:"Tonight:",am:"☀️ Morning",pm:"🌙 Evening",
   amTitle:"Morning routine",amSub:"Glow, brighten, hydrate and protect",pmSub:d=>d+" night routine",now:"Now",step:"Step",doneLbl:"Done",check:"Applied ✓",checked:"✓ Done",edit:"✏️ Edit product",
   edName:"Product name",edPhoto:"New photo",edPrep:"Preparing photo...",edReady:"Photo ready ✓",edBad:"That photo didn't open. Try another.",save:"Save",reset:"Restore original",cancel:"Cancel",saved:"Saved ✓ Updated on every day",resetDone:"Original product restored",
   celAm:"Morning routine done! ☀️",celPm:"Night routine done! 🌙",celAmX:" Reapply sunscreen if you go out.",celPmX:" Sleep well and wake up glowing.",next:"Next step: ",
   water:"💧 Water glasses",wCount:(a,b)=>`${a} of ${b}`,glass:"Glass",wStart:"Tap a glass each time you drink one.",wDone:"Goal reached for today. Happy skin 💙",wLeft:(k,n)=>`${k} glasses to go, come on ${n}`,w8:n=>`8 glasses! Well done, ${n} 💧`,
   week:"Your week",weekLegend:"☀️ AM · 🌙 PM",rem:"🔔 Your reminders",remSub:"on iPhone",remList:[["Morning routine","7:00 AM"],["Evening routine","7:00 PM"],["Drink water","Every 2 hours, 10 AM to 10 PM"]],
   syncDb:"Your progress is saved to your account and shows on any device",syncLocal:"Your progress is saved on this device",footMe:"Made with love for Walaa 💜",footOther:n=>`Made with love for you, ${n} 💜`,switchMe:"Not Walaa? Change name",switchOther:n=>`Not ${n}? Change name`,
   whoT:"Welcome ✨",whoQ:"Who's here today?",whoMe:"I'm Walaa 💜",whoOther:"Someone else",whoName:"What's your name?",whoGo:"Let's start 🌸",hello:n=>`Hi ${n} 💕`,langBtn:"ع",langAria:"العربية"}
};

/* ---------- Time helpers (day rolls over at 4am, so a late night still counts) ---------- */
function rDate(d){ return new Date(d.getTime()-4*3600e3); }
function key(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hashN(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h; }
const now = new Date();
const today = rDate(now);
const todayKey = key(today);
const dow = today.getDay();
const seed = hashN(todayKey);

/* ---------- Store: private db rows when available, browser storage as backup ---------- */
const LS = "lolo-glow-v1";
const Store = {
  cache:{}, col:null, queue:{},
  loadLocal(){ try{ const r=localStorage.getItem(LS); if(r) this.cache=JSON.parse(r)||{}; }catch(e){} },
  saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(this.cache)); }catch(e){} },
  get(k){ return this.cache[k]; },
  set(k,v){
    this.cache[k]=v; this.saveLocal();
    if(this.col){
      const run=()=>this.col.doc(k).set(v).catch(()=>{});
      this.queue[k]=(this.queue[k]||Promise.resolve()).then(run);
    }
  },
  async connect(){
    if(!window.claude || !window.claude.use) return false;
    try{
      const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(db && user){
        const uid=await user.id();
        this.col=db.collection("data/users/"+uid);
        const snap=await this.col.get();
        snap.docs.forEach(d=>{ this.cache[d.id]=d.data(); });
        this.saveLocal();
      }
    }catch(e){ this.col=null; }
    return !!this.col;
  }
};
Store.loadLocal();

/* ---------- Language + name ---------- */
let lang = Store.get("lang")==="en" ? "en" : "ar";
let t = T[lang];
const L = x => (x && typeof x==="object") ? x[lang] : x;
const num = s => lang==="ar" ? String(s).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]) : String(s);
let nm = "";
function profile(){ return Store.get("profile"); }
function isMe(){ const p=profile(); return !p || !!p.me; }
function setWho(){ const p=profile(); const list = (p && !p.me && p.name) ? [p.name] : NAMES[lang]; nm = list[seed % list.length]; }
const fill = s => s.replaceAll("{n}", nm);
function applyLang(){
  t = T[lang];
  const dir = lang==="ar" ? "rtl" : "ltr";
  document.documentElement.lang = lang;
  $("app").dir = dir; $("whoCard").dir = dir; $("toast").dir = dir;
  for(const id of ["langBtn","langBtn2"]){ $(id).textContent=t.langBtn; $(id).setAttribute("aria-label",t.langAria); }
  $("todayLbl").textContent=t.today; $("tabAmTxt").textContent=t.am; $("tabPmTxt").textContent=t.pm;
  $("wTitle").textContent=t.water; $("weekTitle").textContent=t.week; $("weekLegend").textContent=t.weekLegend;
  $("rTitle").textContent=t.rem; $("rSub").textContent=t.remSub;
  const rl=$("remList"); rl.innerHTML="";
  t.remList.forEach(([a,b])=>{ const li=document.createElement("li"); const sp=document.createElement("span"); sp.textContent=a; const bb=document.createElement("b"); bb.textContent=b; li.append(sp,bb); rl.appendChild(li); });
  $("whoT").textContent=t.whoT; $("whoQ").textContent=t.whoQ; $("whoMe").textContent=t.whoMe; $("whoOther").textContent=t.whoOther; $("whoNameLbl").textContent=t.whoName; $("whoGo").textContent=t.whoGo;
}
let synced = null;

/* ---------- Day records ---------- */
function dayDoc(k){ const d=Store.get("day-"+k); return d? {am:d.am||[],pm:d.pm||[],water:d.water||0,amDone:!!d.amDone,pmDone:!!d.pmDone} : {am:[],pm:[],water:0,amDone:false,pmDone:false}; }
function saveDay(k,d){ Store.set("day-"+k,d); }

/* ---------- Product picture ---------- */
function bottleSVG(p){
  const a=p.c1,b=p.c2; let body="";
  if(p.shape==="pump") body=`<rect x="24" y="4" width="18" height="5" rx="2" fill="${b}"/><rect x="28" y="8" width="5" height="10" fill="${b}"/><rect x="22" y="16" width="16" height="8" rx="3" fill="${b}"/><rect x="12" y="23" width="36" height="54" rx="10" fill="${a}" stroke="${b}" stroke-width="2"/>`;
  else if(p.shape==="dropper") body=`<ellipse cx="30" cy="10" rx="7" ry="8" fill="${b}"/><rect x="24" y="16" width="12" height="12" rx="2" fill="${b}"/><rect x="13" y="27" width="34" height="50" rx="9" fill="${a}" stroke="${b}" stroke-width="2"/>`;
  else if(p.shape==="jar") body=`<rect x="8" y="26" width="44" height="14" rx="5" fill="${b}"/><rect x="6" y="38" width="48" height="36" rx="12" fill="${a}" stroke="${b}" stroke-width="2"/>`;
  else body=`<path d="M14 6h32l-4 50H18z" fill="${a}" stroke="${b}" stroke-width="2" stroke-linejoin="round"/><rect x="21" y="56" width="18" height="20" rx="4" fill="${b}"/>`;
  return `<svg viewBox="0 0 60 80" aria-hidden="true">${body}</svg>`;
}
function custom(pk){ return Store.get("prod-"+pk)||{}; }
function pName(pk){ return custom(pk).name || P[pk].name; }
function pPhoto(pk){ const ph=custom(pk).photo; return (typeof ph==="string" && ph.startsWith("data:image/")) ? ph : ""; }
function thumbHTML(pk){
  const ph=pPhoto(pk);
  if(ph) return `<img class="own" alt="" src="${ph}">`;
  if(IMG[pk]) return `<img class="cut" alt="" src="${IMG[pk]}">`;
  return bottleSVG(P[pk]);
}

/* ---------- Render ---------- */
let tab = (now.getHours()>=15 || now.getHours()<4) ? "pm" : "am";
function $(id){ return document.getElementById(id); }
function routineFor(tb, d){ return tb==="am" ? MORNING : NIGHTS[d].steps; }

function renderHero(){
  const night = NIGHTS[dow];
  $("date").textContent = lang==="ar" ? `${DAYS.ar[dow]} ${num(today.getDate())} ${MONTHS.ar[today.getMonth()]}` : `${DAYS.en[dow]}, ${MONTHS.en[today.getMonth()]} ${today.getDate()}`;
  const h=now.getHours();
  const g = (h>=4 && h<12) ? t.greetAm : (h>=12 && h<17) ? t.greetMid : t.greetPm;
  $("greet").textContent = g+" "; const s=document.createElement("span"); s.className="nm"; s.textContent=nm; $("greet").appendChild(s);
  $("quote").textContent = fill(QUOTES[lang][seed % QUOTES[lang].length]);
  $("nightChip").textContent = `${night.ic} ${t.tonight} `; const b=document.createElement("b"); b.textContent=L(night.short); $("nightChip").appendChild(b);
  const doc=dayDoc(todayKey);
  const total=MORNING.length+night.steps.length, done=doc.am.length+doc.pm.length;
  $("pct").textContent=num(Math.round(done/total*100))+(lang==="ar"?"٪":"%");
  $("ringArc").style.strokeDashoffset = 213.6*(1-done/total);
  $("streakChip").textContent = t.streak(streak()).replace(/\d+/,m=>num(m));
  $("cnt-am").textContent = num(doc.am.length+"/"+MORNING.length);
  $("cnt-pm").textContent = num(doc.pm.length+"/"+night.steps.length);
}
function streak(){
  let n=0; const d=new Date(today);
  const td=dayDoc(key(d)); if(!(td.amDone&&td.pmDone)) d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){ const x=dayDoc(key(d)); if(x.amDone&&x.pmDone){n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}

function renderPanel(){
  const doc=dayDoc(todayKey);
  const steps=routineFor(tab,dow);
  $("tab-am").setAttribute("aria-selected", tab==="am");
  $("tab-pm").setAttribute("aria-selected", tab==="pm");
  if(tab==="am"){ $("ptitle").textContent=t.amTitle; $("psub").textContent=t.amSub; $("pnote").hidden=true; }
  else { const n=NIGHTS[dow]; $("ptitle").textContent=L(n.title); $("psub").textContent=t.pmSub(DAYS[lang][dow]); $("pnote").hidden=!n.note; if(n.note) $("pnote").textContent=L(n.note); }
  const doneArr=doc[tab];
  const nextIdx = steps.findIndex((s,i)=>!doneArr.includes(i));
  $("pbar").style.width = (doneArr.length/steps.length*100)+"%";
  const ol=$("steps"); ol.innerHTML="";
  steps.forEach((s,i)=>{
    const done=doneArr.includes(i), isNow=i===nextIdx;
    const li=document.createElement("li");
    li.className="step"+(done?" done":"")+(isNow?" now":"");
    li.innerHTML=`<div class="thumb">${thumbHTML(s.p)}</div>
      <div class="info">
        <div class="lbl"><span class="n">${num(i+1)}</span><span class="t"></span>${isNow?'<span class="now-tag"></span>':""}</div>
        <h3></h3><div class="prod"></div><p class="tip"></p>
        <div class="acts">
          <button class="check" type="button" id="chk-${tab}-${i}"></button>
          <button type="button" class="photo-btn edit-btn" id="ed-${tab}-${i}"></button>
        </div>
        <div class="editor" hidden>
          <label class="ed-lbl" for="nm-${tab}-${i}"></label>
          <input class="ed-name" id="nm-${tab}-${i}" maxlength="80" dir="auto">
          <label class="photo-btn ed-photo">📷 <span></span><input type="file" accept="image/*" id="ph-${tab}-${i}"></label>
          <div class="ed-row">
            <button type="button" class="check ed-save"></button>
            <button type="button" class="photo-btn ed-reset"></button>
            <button type="button" class="photo-btn ed-cancel"></button>
          </div>
        </div>
      </div>`;
    const q = sel => li.querySelector(sel);
    q(".t").textContent = done?t.doneLbl:t.step;
    if(isNow) q(".now-tag").textContent=t.now;
    q("h3").textContent=L(s.t);
    q(".prod").textContent=pName(s.p);
    q(".tip").textContent=L(s.tip);
    q(".check").textContent = done?t.checked:t.check;
    q(".edit-btn").textContent=t.edit;
    q(".ed-lbl").textContent=t.edName; q(".ed-photo span").textContent=t.edPhoto;
    q(".ed-save").textContent=t.save; q(".ed-reset").textContent=t.reset; q(".ed-cancel").textContent=t.cancel;
    const im=q(".thumb img"); if(im) im.addEventListener("error",()=>{ im.parentNode.innerHTML=bottleSVG(P[s.p]); });
    q(".check").addEventListener("click",()=>toggle(i));
    wireEditor(li,s.p);
    ol.appendChild(li);
  });
  const complete = doneArr.length===steps.length;
  $("celebrate").hidden=!complete;
  if(complete){
    $("celTitle").textContent = tab==="am" ? t.celAm : t.celPm;
    $("celText").textContent = fill(DONE_MSGS[lang][(seed+(tab==="am"?0:1))%DONE_MSGS[lang].length]) + (tab==="am" ? t.celAmX : t.celPmX);
  }
}

function toggle(i){
  const doc=dayDoc(todayKey); const arr=doc[tab];
  const at=arr.indexOf(i);
  if(at>=0) arr.splice(at,1); else arr.push(i);
  const steps=routineFor(tab,dow);
  const wasDone = tab==="am"?doc.amDone:doc.pmDone;
  const nowDone = steps.every((s,j)=>arr.includes(j));
  if(tab==="am") doc.amDone=nowDone; else doc.pmDone=nowDone;
  saveDay(todayKey,doc);
  renderPanel(); renderHero(); renderWeek();
  if(nowDone && !wasDone){ confetti(); toast(fill(DONE_MSGS[lang][Math.floor(Math.random()*DONE_MSGS[lang].length)])); }
  else if(at<0){ const nxt=steps.findIndex((s,j)=>!arr.includes(j)); if(nxt>=0) toast(t.next+L(steps[nxt].t)); }
}

function renderWater(){
  const doc=dayDoc(todayKey); const g=$("glasses"); g.innerHTML="";
  for(let i=0;i<8;i++){
    const b=document.createElement("button"); b.type="button"; b.id="water-"+i;
    b.className="glass"+(i<doc.water?" on":""); b.setAttribute("aria-label",t.glass+" "+(i+1));
    b.innerHTML=`<svg viewBox="0 0 30 40"><path class="w" d="M6 14h18l-2 22H8z"/><path class="o" d="M4 4h22l-3 33H7z" stroke-linejoin="round"/></svg>`;
    b.addEventListener("click",()=>{ const d=dayDoc(todayKey); d.water = (i<d.water && i===d.water-1) ? i : i+1; saveDay(todayKey,d); renderWater(); if(d.water===8){ toast(t.w8(nm).replace("8",num(8))); confetti(); } });
    g.appendChild(b);
  }
  $("wCount").textContent = t.wCount(num(doc.water),num(8));
  const left=8-doc.water;
  $("wMsg").textContent = left<=0 ? t.wDone : left===8 ? t.wStart : t.wLeft(num(left),nm);
}

let selDay = dow;
function renderWeek(){
  const w=$("week"); w.innerHTML="";
  const start=new Date(today); start.setDate(today.getDate()-((today.getDay()+1)%7));
  WEEK_ORDER.forEach((d,idx)=>{
    const dt=new Date(start); dt.setDate(start.getDate()+idx);
    const doc=dayDoc(key(dt));
    const b=document.createElement("button"); b.type="button"; b.id="day-"+d;
    b.className="day"+(d===dow?" today":"");
    b.setAttribute("aria-pressed", d===selDay);
    const short = lang==="ar" ? DAYS.ar[d].replace("ال","") : DAYS.en[d].slice(0,3);
    b.innerHTML=`<span class="dn"></span><span class="ic">${NIGHTS[d].ic}</span><span class="dots"><i class="${doc.amDone?"f":""}"></i><i class="${doc.pmDone?"f":""}"></i></span>`;
    b.querySelector(".dn").textContent=short;
    b.addEventListener("click",()=>{ selDay=d; renderPreview(); });
    w.appendChild(b);
  });
  renderPreview();
}
function renderPreview(){
  const n=NIGHTS[selDay]; const pv=$("preview");
  pv.innerHTML=`<h3></h3><ol></ol>`;
  pv.querySelector("h3").textContent = `${n.ic} ${DAYS[lang][selDay]}: ${L(n.title)}`;
  const ol=pv.querySelector("ol");
  n.steps.forEach(s=>{ const li=document.createElement("li"); li.textContent=L(s.t)+" · "+pName(s.p); ol.appendChild(li); });
}

/* ---------- Product editor ---------- */
function wireEditor(li,pk){
  const ed=li.querySelector(".editor"), btn=li.querySelector(".edit-btn"), inp=li.querySelector(".ed-name"), file=li.querySelector(".ed-photo input"), lbl=li.querySelector(".ed-photo span");
  let pending=null;
  btn.addEventListener("click",()=>{ ed.hidden=!ed.hidden; if(!ed.hidden){ inp.value=pName(pk); pending=null; lbl.textContent=t.edPhoto; inp.focus(); } });
  file.addEventListener("change",async e=>{ const f=e.target.files[0]; if(!f) return; lbl.textContent=t.edPrep; try{ pending=await shrink(f); lbl.textContent=t.edReady; li.querySelector(".thumb").innerHTML=`<img class="own" alt="" src="${pending}">`; }catch(err){ lbl.textContent=t.edBad; } });
  li.querySelector(".ed-save").addEventListener("click",()=>{
    const c=Object.assign({},custom(pk)); const n=inp.value.trim();
    if(n && n!==P[pk].name) c.name=n; else delete c.name;
    if(pending) c.photo=pending;
    Store.set("prod-"+pk,c); renderPanel(); renderPreview(); toast(t.saved);
  });
  li.querySelector(".ed-reset").addEventListener("click",()=>{ Store.set("prod-"+pk,{}); renderPanel(); renderPreview(); toast(t.resetDone); });
  li.querySelector(".ed-cancel").addEventListener("click",()=>{ ed.hidden=true; renderPanel(); });
}
function shrink(file){
  return new Promise((ok,bad)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const m=320, r=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      try{ ok(c.toDataURL("image/jpeg",.78)); }catch(e){ bad(e); } };
    img.onerror=bad; img.src=url;
  });
}

/* ---------- Toast + confetti ---------- */
let tt;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2600); }
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("confetti"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#ec6ea3","#9b7fdc","#ffc9dc","#d7c4f2","#ffd27a","#a9d8ff"];
  const ps=Array.from({length:110},()=>({x:c.width/2,y:c.height*0.35,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,r:Math.random()*5+3,c:cols[Math.floor(Math.random()*cols.length)],s:Math.random()<.35}));
  let f=0;
  (function loop(){ x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; x.fillStyle=p.c;
      if(p.s){ x.font=(p.r*3)+"px serif"; x.fillText("♥",p.x,p.y); } else { x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); } });
    if(++f<110) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height); })();
}

/* ---------- Wire up ---------- */
$("tab-am").addEventListener("click",()=>{ tab="am"; renderPanel(); });
$("tab-pm").addEventListener("click",()=>{ tab="pm"; renderPanel(); });
function renderAll(){
  setWho(); applyLang();
  const me=isMe();
  $("remCard").hidden=!me;
  $("foot").textContent = me ? t.footMe : t.footOther(nm);
  $("switchWho").textContent = me ? t.switchMe : t.switchOther(nm);
  $("who").hidden = !!profile();
  renderHero(); renderPanel(); renderWater(); renderWeek();
}
function switchLang(){ lang = lang==="ar" ? "en" : "ar"; Store.set("lang",lang); renderAll(); }
$("langBtn").addEventListener("click",switchLang);
$("langBtn2").addEventListener("click",()=>{ const wasOpen=!$("who").hidden; switchLang(); if(wasOpen) $("who").hidden=false; });
function chooseWho(p){ Store.set("profile",p); $("whoForm").hidden=true; $("whoStep1").hidden=false; renderAll(); confetti(); toast(t.hello(nm)); }
$("whoMe").addEventListener("click",()=>chooseWho({me:true}));
$("whoOther").addEventListener("click",()=>{ $("whoStep1").hidden=true; $("whoForm").hidden=false; $("whoName").focus(); });
$("whoForm").addEventListener("submit",e=>{ e.preventDefault(); const n=$("whoName").value.trim().slice(0,20); if(n) chooseWho({me:false,name:n}); });
$("switchWho").addEventListener("click",()=>{ $("whoName").value=""; $("whoForm").hidden=true; $("whoStep1").hidden=false; $("who").hidden=false; });
renderAll();
Store.connect().then(ok=>{
  synced = ok;
  if(ok && Store.get("profile")) Store.set("profile",Store.get("profile"));
  if(Store.get("lang")==="en" || Store.get("lang")==="ar") lang = Store.get("lang");
  renderAll();
});
})();
</script>

<script>
/* Remove the old offline helper from phones that opened the earlier version */
try{ if("serviceWorker" in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{}); } }catch(e){}
try{ if(window.caches){ caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{}); } }catch(e){}
</script>
